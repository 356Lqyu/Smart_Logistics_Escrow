<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agreements - LogisticsEscrow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <aside id="sidebar-container" class="sidebar"></aside>

    <!-- Main container -->
    <main class="main-content">
        <!-- Top Bar for search, notification etc -->
        <header class="top-navbar">
            <div class="page-title-block">
                <h1 id="page-heading">Agreements</h1>
                <div class="network-stats">
                    <span class="dot"></span> Chain ID: x &nbsp;&bull;&nbsp; Gas: xx Gwei &nbsp;&bull;&nbsp; ETH: $xx
                </div>
            </div>
            
            <div class="top-nav-right">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search agreements...">
                </div>
                <button class="icon-btn"><i class="fa-regular fa-bell"></i><span class="badge-dot"></span></button>
                <div class="wallet-badge" id="top-wallet-badge">
                    <span class="wallet-glow-dot"></span> xxxx
                </div>
            </div>
        </header>

        <!-- Agreements body content section-->
        <div class="dashboard-body-placeholder">
            
            <!-- Bar: Search Input, Filter Tabs, and New Agreement Button -->
            <div class="agreements-controls">
                <div class="search-box filter-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="table-search-input" placeholder="Search by ID or payload">
                </div>
                
                <div class="filter-tabs">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="funded">Funded</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                    <button class="filter-btn" data-filter="refunded">Refunded</button>
                    <button class="filter-btn" data-filter="available">Available</button>
                </div>

                <button class="primary-action-btn" onclick="openCreateAgreementModal()">
                    <i class="fa-solid fa-circle-plus"></i> New Agreement
                </button>
            </div>

            <!-- Agreements Table Card Container -->
            <div class="table-card">
                <table class="agreements-table">
                    <thead>
                        <tr>
                            <th>REFERENCE</th>
                            <th>SHIPPER</th>
                            <th>CARRIER</th>
                            <th>PAYLOAD</th>
                            <th>PRIORITY</th>
                            <th>ESCROW</th>
                            <th>DEADLINE</th>
                            <th>STATUS</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="agreements-table-body">
                        <!-- Dynamic data rows will be injected here from blockchain -->
                        <tr>
                            <td colspan="9" style="text-align: center; color: #8d99ae; padding: 30px;">
                                <i class="fa-solid fa-spinner fa-spin"></i> Connecting to Ethereum smart contract & loading agreements...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/agreements.js"></script>
</body>
</html>
