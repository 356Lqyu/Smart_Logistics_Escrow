<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agreements - LogisticsEscrow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <aside id="sidebar-container" class="sidebar"></aside>

    <!-- Main container -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="top-navbar">
            <div class="page-title-block">
                <h1 id="page-heading">Dashboard</h1>
            </div>
            
            <div class="top-nav-right">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search agreements...">
                </div>
            </div>
        </header>

        <!-- Agreements body content section-->
        <div class="dashboard-body-placeholder">

            <!-- Bar: Search Input, Filter Tabs, and New Agreement Button -->
            <div class="agreements-controls">
                <div class="search-box filter-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="table-search-input" placeholder="Search by ID or payload">
                </div>

                <div class="filter-tabs">

                    <button class="filter-btn active" data-filter="all">
                        All
                    </button>

                    <button class="filter-btn" data-filter="created">
                        Created
                    </button>

                    <button class="filter-btn" data-filter="in progress">
                        In Progress
                    </button>

                    <button class="filter-btn" data-filter="completed">
                        Completed
                    </button>

                    <button class="filter-btn" data-filter="cancelled">
                        Cancelled
                    </button>

                    <button class="filter-btn" data-filter="expired">
                        Expired
                    </button>

                </div>

                <button class="primary-action-btn" onclick="window.location.href='createAgreement.html'">
                    <i class="fa-solid fa-circle-plus"></i> New Agreement
                </button>
            </div>

            <!-- Agreements Table Card Container -->
            <div class="table-card">
                <table class="agreements-table">
                    <thead>
                        <tr>
                            <th>REFERENCE</th>
                            <th>SHIPPER</th>
                            <th>CARRIER</th>
                            <th>PAYLOAD</th>
                            <th>PRIORITY</th>
                            <th>ESCROW</th>
                            <th>DEADLINE</th>
                            <th>STATUS</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="agreements-table-body">
                        <tr>
                            <td colspan="9" style="text-align: center; color: #8d99ae; padding: 30px;">
                                <i class="fa-solid fa-spinner fa-spin"></i> Connecting to Ethereum smart contract &
                                loading agreements...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.4/dist/web3.min.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/contract.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/agreements.js"></script>
</body>

</html>
