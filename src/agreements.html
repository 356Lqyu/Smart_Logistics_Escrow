<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agreements - LogisticsEscrow</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/agreement.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <aside id="sidebar-container" class="sidebar"></aside>

    <main class="main-content">
      <div id="shared-header" data-page-title="Agreements"></div>

      <div class="dashboard-body-placeholder">
        <div
          id="extension-notification-bar"
          class="profile-identity-card"
          style="
            display: none;
            margin-bottom: 20px;
            border-color: rgba(245, 158, 11, 0.4);
            background: linear-gradient(180deg, #1e2538 0%, #111827 100%);
          "
        >
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              gap: 16px;
              flex-wrap: wrap;
            "
          >
            <div style="display: flex; align-items: center; gap: 12px">
              <div
                class="profile-stat-icon gold"
                style="
                  width: 40px;
                  height: 40px;
                  border-radius: 10px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  background: rgba(245, 158, 11, 0.15);
                  color: #fbbf24;
                "
              >
                <i class="fa-solid fa-clock-rotate-left"></i>
              </div>
              <div>
                <h3 style="color: #fff; font-size: 16px; margin-bottom: 2px">
                  Deadline Extension Requested
                </h3>
                <p
                  id="extension-bar-details"
                  style="color: #8d99ae; font-size: 13px; margin: 0"
                >
                  Carrier requested an extension for agreement #<span
                    id="ext-bar-ref"
                    >---</span
                  >.
                </p>
              </div>
            </div>
            <div style="display: flex; gap: 10px">
              <button
                type="button"
                class="primary-action-btn"
                id="bar-approve-ext-btn"
                style="padding: 8px 14px; font-size: 13px; background: #059669"
              >
                <i class="fa-solid fa-check"></i> Approve
              </button>
              <button
                type="button"
                class="cancel-btn"
                id="bar-reject-ext-btn"
                style="padding: 8px 14px; font-size: 13px"
              >
                <i class="fa-solid fa-xmark"></i> Reject
              </button>
            </div>
          </div>
        </div>

        <!-- Bar: Search Input, Filter Tabs, and New Agreement Button -->
        <div class="agreements-controls">
          <div class="search-box filter-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              id="table-search-input"
              placeholder="Search by ID or payload"
            />
          </div>

          <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all">All</button>

            <button class="filter-btn" data-filter="in progress">
              In Progress
            </button>

            <button class="filter-btn" data-filter="completed">
              Completed
            </button>

            <button class="filter-btn" data-filter="cancelled">
              Cancelled
            </button>

            <button class="filter-btn" data-filter="expired">Expired</button>
          </div>

          <button
            id="new-agreement-btn"
            class="primary-action-btn"
            onclick="window.location.href = 'createAgreement.html'"
          >
            <i class="fa-solid fa-circle-plus"></i> New Agreement
          </button>
        </div>

        <div class="table-card">
          <table class="agreements-table">
            <thead>
              <tr>
                <th>REFERENCE</th>
                <th>SHIPPER</th>
                <th>CARRIER</th>
                <th>PAYLOAD</th>
                <th>PRIORITY</th>
                <th>ESCROW</th>
                <th>DEADLINE</th>
                <th>STATUS</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="agreements-table-body">
              <tr>
                <td
                  colspan="9"
                  style="text-align: center; color: #8d99ae; padding: 30px"
                >
                  <i class="fa-solid fa-spinner fa-spin"></i> Connecting to
                  Ethereum smart contract & Checking blockchain status & loading
                  agreements...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.4/dist/web3.min.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/contract.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/agreements.js"></script>
    <script src="js/agreementActions.js"></script>
  </body>
</html>
