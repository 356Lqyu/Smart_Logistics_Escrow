<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LogisticsEscrow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- sidebar loaded dynamically via javascript from sidebar.html -->
    <aside id="sidebar-container" class="sidebar"></aside>

    <!-- Main container -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="top-navbar">
            <div class="page-title-block">
                <h1 id="page-heading">Dashboard</h1>
            </div>
            
            <div class="top-nav-right">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search agreements...">
                </div>
            </div>
        </header>

        <!-- Dashboard body content section  -->
        <div class="dashboard-body-placeholder" id="dashboard-content">

        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.4/dist/web3.min.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
