<header class="top-navbar">
  <div class="page-title-block">
    <h1 id="page-heading">Dashboard</h1>
    <div class="network-stats" aria-label="Network information">
      <span
        class="network-stat"
        tabindex="0"
        data-tooltip="The unique identifier of the blockchain network your wallet is connected to."
        >Chain ID: <strong id="chain-id">—</strong></span
      >
      <span class="dot" aria-hidden="true"></span>
      <span
        class="network-stat"
        tabindex="0"
        data-tooltip="The network fee rate used to process a blockchain transaction, measured in Gwei."
        >Gas: <strong id="gas-price">—</strong></span
      >
      <span class="dot" aria-hidden="true"></span>
      <span
        class="network-stat"
        tabindex="0"
        data-tooltip="The current market price of one Ether (ETH) in US dollars."
        >ETH: <strong id="eth-price">—</strong></span
      >
    </div>
  </div>
  <div class="top-nav-right">
    <div class="wallet-badge">
      <span class="wallet-glow-dot"></span>
      <span id="top-wallet-address">Connecting...</span>
      <span class="wallet-avatar" aria-hidden="true"></span>
    </div>
  </div>
</header>
