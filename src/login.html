<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In - LogisticsEscrow</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <i class="fa-solid fa-truck"></i>
            LogisticsEscrow
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Log in with your email and password, then connect the MetaMask
            wallet you registered with to reach your dashboard.
        </p>

        <form id="loginForm" autocomplete="off">

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
                    <button type="button" class="password-toggle" data-toggle-for="password" aria-label="Show password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="button" id="loginBtn" class="login-btn" onclick="loginUser()">
                <i class="fa-solid fa-right-to-bracket"></i>
                Log In
            </button>

            <p id="message"></p>

            <p class="auth-switch">
                Don't have an account? <a href="register.html">Register</a>
            </p>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/web3@1.10.4/dist/web3.min.js"></script>

<script src="js/supabase.js"></script>
<script src="js/login.js"></script>

</body>

</html>
