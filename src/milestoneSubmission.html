<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milestone Submission - LogisticsEscrow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <aside id="sidebar-container" class="sidebar"></aside>

    <main class="main-content">
        <header class="top-navbar">
            <div class="page-title-block">
                <h1 id="page-heading">Milestone Submission</h1>
            </div>
            <div class="top-nav-right">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search agreements...">
                </div>
            </div>
        </header>

        <div class="dashboard-body-placeholder agreement-details-page">
            <div class="agreement-back">
                <a href="milestones.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Milestones
                </a>
            </div>

            <div id="submission-page">
                <div class="details-loading">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p style="margin-top: 10px;">Loading milestone…</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.4/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/contract.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/milestoneSubmission.js"></script>
</body>

</html>
