<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Milestone Management - LogisticsEscrow</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/milestone.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <aside id="sidebar-container" class="sidebar"></aside>

    <main class="main-content">
      <div id="shared-header" data-page-title="Milestone"></div>

      <div class="dashboard-body-placeholder">
        <!-- Verification Pending Reminder Bar -->
        <div
          id="verification-reminder-bar"
          class="profile-identity-card"
          style="
            display: none;
            margin-bottom: 20px;
            border-color: rgba(245, 158, 11, 0.4);
            background: linear-gradient(180deg, #1e2538 0%, #111827 100%);
          "
        >
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              gap: 16px;
              flex-wrap: wrap;
            "
          >
            <div style="display: flex; align-items: center; gap: 12px">
              <div
                class="profile-stat-icon gold"
                style="
                  width: 40px;
                  height: 40px;
                  border-radius: 10px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  background: rgba(245, 158, 11, 0.15);
                  color: #fbbf24;
                "
              >
                <i class="fa-solid fa-triangle-exclamation"></i>
              </div>
              <div>
                <h3 style="color: #fff; font-size: 16px; margin-bottom: 2px">
                  Verification Pending Reminder
                </h3>
                <p
                  id="verification-bar-details"
                  style="color: #8d99ae; font-size: 13px; margin: 0"
                >
                  Verification pending over 5 minutes for milestone...
                </p>
              </div>
            </div>
          </div>
        </div>
        <div id="milestones-page-container">
          <div style="text-align: center; color: #8d99ae; padding: 40px">
            <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top: 10px">Loading in-progress agreements...</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.4/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/contract.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/milestones.js"></script>
    <script src="js/agreementActions.js"></script>
  </body>
</html>
