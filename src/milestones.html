<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milestone Management - LogisticsEscrow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- =========================
         SIDEBAR CONTAINER
    ========================== -->
    <aside id="sidebar-container" class="sidebar"></aside>

    <main class="main-content">
        <header class="top-navbar">
            <div class="page-title-block">
                <h1 id="page-heading">Milestone Management</h1>
            <div class="network-stats">
                    <span>Chain ID: <strong id="chain-id">—</strong></span>
                    <span class="dot"></span>
                    <span>Gas: <strong id="gas-price">—</strong></span>
                    <span class="dot"></span>
                    <span>ETH: <strong id="eth-price">—</strong></span>
                </div>
            </div>

            <div class="top-nav-right">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search agreements...">
                </div>


                <div class="wallet-badge">
                    <span class="wallet-glow-dot"></span>
                    <span id="top-wallet-address">Connecting...</span>
                    <span class="wallet-avatar" aria-hidden="true"></span>
                </div>
            </div>
        </header>

        <div class="dashboard-body-placeholder">
            <div id="milestones-page-container">
                <div style="text-align: center; color: #8d99ae; padding: 40px;">
                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top: 10px;">Loading in-progress agreements...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.4/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/contract.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/milestones.js"></script>
</body>

</html>
