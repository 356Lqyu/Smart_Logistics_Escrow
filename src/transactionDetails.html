<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Details - LogisticsEscrow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/agreement.css">
    <link rel="stylesheet" href="css/milestone.css">
    <link rel="stylesheet" href="css/transaction.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <aside id="sidebar-container" class="sidebar"></aside>

    <main class="main-content">
        <header class="top-navbar">
            <div class="page-title-block">
                <h1 id="page-heading">Transaction Details</h1>
            </div>
            <div class="top-nav-right"></div>
        </header>

        <div class="dashboard-body-placeholder agreement-details-page">
            <div class="agreement-back">
                <a href="transactionHistory.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Transaction History</span>
                </a>
            </div>

            <div id="details-loading" class="details-loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p style="margin-top: 10px;">Loading transaction details...</p>
            </div>

            <div id="details-error" class="details-error" style="display:none;"></div>

            <div id="transaction-content" style="display:none;">
                <section class="agreement-summary-card" style="margin-bottom: 20px;">
                    <div class="agreement-summary-header">
                        <div>
                            <div class="agreement-title-row">
                                <h2 id="tx-event-type">Transaction Event</h2>
                                <span id="tx-status" class="status-badge status-active">
                                    <span class="status-dot"></span>
                                    Recorded
                                </span>
                            </div>
                            <p id="tx-description" class="agreement-shipment">Transaction description details</p>
                        </div>
                    </div>
                </section>

                <section class="details-card shipment-agreement-card">
                    <div class="agreement-info-grid" style="grid-template-columns: repeat(2, 1fr); margin-bottom: 24px;">
                        <div class="info-item">
                            <span>TRANSACTION ID / HASH</span>
                            <strong id="tx-hash" style="font-family: monospace; color: #38bdf8; word-break: break-all;">-</strong>
                        </div>
                        <div class="info-item">
                            <span>TIMESTAMP</span>
                            <strong id="tx-timestamp" style="font-family: monospace; color: #34d399;">-</strong>
                        </div>
                    </div>

                    <div class="detail-subsection" style="border-top:none; padding-top:0;">
                        <div class="detail-subsection-header">
                            <div class="detail-subsection-title">
                                <span class="subsection-icon"><i class="fa-solid fa-file-contract"></i></span>
                                <div>
                                    <span class="subsection-kicker">AGREEMENT CONTEXT</span>
                                    <h3>Agreement Reference No</h3>
                                </div>
                            </div>
                        </div>
                        <div class="shipment-description-box" style="margin-bottom: 24px;">
                            <div id="tx-agreement-ref" class="shipment-description" style="font-family: monospace; font-weight: 600; color: #f2f7ff;">-</div>
                        </div>

                        <div id="tx-amount-wrapper" style="display:none;">
                            <div class="detail-subsection-header">
                                <div class="detail-subsection-title">
                                    <span class="subsection-icon"><i class="fa-solid fa-coins"></i></span>
                                    <div>
                                        <span class="subsection-kicker">FINANCIALS</span>
                                        <h3>Transaction Amount</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="shipment-description-box" style="margin-bottom: 24px;">
                                <div id="tx-amount" class="shipment-description" style="font-family: monospace; font-weight: 600; color: #fbbf24;">—</div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.4/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/contract.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/transactionDetails.js"></script>
</body>

</html>
